name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # MinVer needs full history to compute version from tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build nulic/nulic.csproj --nologo -c Release

      - name: Test
        run: dotnet test testprojects/unit_tests --nologo -c Release

      - name: Dog-food (run nulic on itself)
        run: dotnet nulic/bin/Release/net10.0/nulic.dll nulic/

      - name: Publish license report to job summary
        run: cat nulic/third-party-notices/third-party-notices.md >> $GITHUB_STEP_SUMMARY

      - name: Upload licenses as artifact
        uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: nulic/third-party-notices/

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack nulic/nulic.csproj --nologo -c Release -o nupkg

      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
